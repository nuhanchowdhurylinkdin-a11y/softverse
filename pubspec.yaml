name: softverse
description: "A Flutter project with GetX boilerplate."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.5
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.0.0
  image_picker: ^1.2.1
  mime: ^2.0.0
  get: ^4.7.3
  iconsax_flutter: ^1.0.1
  skeletonizer: ^2.1.3
  flutter_dotenv: ^5.2.1
  mobile_scanner: ^7.1.2
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo/
    - assets/icon/
    - assets/images/walkthrough/
